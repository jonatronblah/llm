services:
  llamacpp-server:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    ports:
      - 8080:8080
    volumes:
      - ./models:/models
    environment:
      LLAMA_ARG_MODEL: /models/phi-4-Q6_K_L.gguf
      # alternatively, you can use "LLAMA_ARG_MODEL_URL" to download the model
      # LLAMA_ARG_MODEL: /models/DeepSeek-R1-Distill-Qwen-14B-Q6_K_L.gguf
      # LLAMA_ARG_MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-Coder-14B-Instruct-GGUF/blob/main/Qwen2.5-Coder-14B-Instruct-Q6_K.gguf
      LLAMA_ARG_CTX_SIZE: 8192
      LLAMA_ARG_N_PARALLEL: 2
      LLAMA_ARG_ENDPOINT_METRICS: 1
      LLAMA_ARG_PORT: 8080
      LLAMA_ARG_HOST: 0.0.0.0
      # LLAMA_ARG_NO_WEBUI: 1
      LLAMA_ARG_N_GPU_LAYERS: 99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]  
